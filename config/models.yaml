# 모델 목록
# 모델을 추가하려면 models 아래에 항목을 하나 더 적으면 됩니다.
# optional: true 인 모델은 기본 설치에서 빠지고, 받지 않으면 자동 선택에도 나오지 않습니다.
# file.dir 은 ComfyUI/models 아래 폴더 이름입니다.

families:
  zimage:
    name: "Z-Image Turbo"
    # unet = 본체만 있는 파일(텍스트 인코더/VAE 따로), checkpoint = 전부 들어있는 파일
    loader: unet
    clip: qwen_3_4b_fp8_mixed.safetensors
    clip_type: lumina2
    vae: ae.safetensors
    latent: sd3
    shift: 3
    steps: 8
    cfg: 1.0
    sampler: res_multistep
    scheduler: simple
    negative: false          # Turbo 모델은 부정 프롬프트를 쓰지 않음
    prompt_prefix: ""
    files:
      - name: qwen_3_4b_fp8_mixed.safetensors
        dir: text_encoders
        url: https://huggingface.co/Comfy-Org/Z-Image-Turbo/resolve/main/split_files/text_encoders/qwen_3_4b_fp8_mixed.safetensors
        size: 5631994051
        sha256: 72450b19758172c5a7273cf7de729d1c17e7f434a104a00167624cba94f68f15
      - name: ae.safetensors
        dir: vae
        url: https://huggingface.co/Comfy-Org/Z-Image-Turbo/resolve/main/split_files/vae/ae.safetensors
        size: 335304388
        sha256: afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38

  illustrious:
    name: "Illustrious (SDXL)"
    loader: checkpoint
    latent: sdxl
    clip_skip: 2
    steps: 28
    cfg: 5.0
    sampler: euler_ancestral
    scheduler: normal
    negative: true
    prompt_prefix: "masterpiece, best quality, amazing quality, very aesthetic, "
    negative_default: "lowres, worst quality, low quality, bad anatomy, bad hands, extra fingers, missing fingers, jpeg artifacts, watermark, signature, text, blurry"
    files: []

  qwen21:
    name: "Qwen-Image 2.1"
    loader: unet
    clip: qwen3vl_8b_int8_convrot.safetensors
    clip_type: qwen_image
    vae: qwen_image_2.1_vae_bf16.safetensors
    encoder: qwen21
    latent: generic
    # Turbo의 공식 8단계 스케줄 (ComfyUI 공식 템플릿 값)
    sigmas: "1.0, 0.978453, 0.95418, 0.926626, 0.89508, 0.845148, 0.704534, 0.414568, 0"
    steps: 8
    cfg: 1.0
    sampler: euler
    scheduler: simple
    negative: true
    prompt_prefix: ""
    files:
      - name: qwen3vl_8b_int8_convrot.safetensors
        dir: text_encoders
        url: https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/text_encoders/qwen3vl_8b_int8_convrot.safetensors
        size: 9350798360
        sha256: 8bfd0f6e12abf2d2d697ecc888e5e90b0d6741d6708f05799f53afa560452e8f
      - name: qwen_image_2.1_vae_bf16.safetensors
        dir: vae
        url: https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors
        size: 675509688
        sha256: bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9

  wan22:
    name: "Wan 2.2 14B"
    loader: unet
    clip: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    clip_type: wan
    vae: wan_2.1_vae.safetensors        # Wan 2.2 14B는 2.1과 같은 VAE를 씁니다
    latent: video                       # 1프레임 영상 = 사진
    shift_node: sd3
    shift: 5
    high_noise: wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
    switch_step: 2
    # ComfyUI 공식 템플릿의 4단계 LightX2V 설정 (빠름). 끄려면 loras를 비우고 steps 20, cfg 3.5, shift 8, switch_step 10
    loras:
      - {name: wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors, stage: high, strength: 1.0}
      - {name: wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors, stage: low, strength: 1.0}
    steps: 4
    cfg: 1.0
    sampler: euler
    scheduler: simple
    negative: true
    prompt_prefix: ""
    negative_default: "oversaturated, overexposed, blurry details, subtitles, watermark, worst quality, low quality, jpeg artifacts, ugly, deformed, extra fingers, bad hands, bad face, malformed limbs, fused fingers, messy background"
