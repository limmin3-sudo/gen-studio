# 모델 목록
# 모델을 추가하려면 models 아래에 항목을 하나 더 적으면 됩니다.
# file.dir 은 ComfyUI/models 아래 폴더 이름입니다.

families:
  zimage:
    name: "Z-Image Turbo"
    # unet = 본체만 있는 파일(텍스트 인코더/VAE 따로), checkpoint = 전부 들어있는 파일
    loader: unet
    clip: qwen_3_4b_fp8_mixed.safetensors
    clip_type: lumina2
    vae: ae.safetensors
    latent: sd3
    shift: 3
    steps: 8
    cfg: 1.0
    sampler: res_multistep
    scheduler: simple
    negative: false          # Turbo 모델은 부정 프롬프트를 쓰지 않음
    prompt_prefix: ""
    files:
      - name: qwen_3_4b_fp8_mixed.safetensors
        dir: text_encoders
        url: https://huggingface.co/Comfy-Org/Z-Image-Turbo/resolve/main/split_files/text_encoders/qwen_3_4b_fp8_mixed.safetensors
        size: 5631994051
